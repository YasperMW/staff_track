name: staff_track
description: "A Flutter app for tracking employee attendance."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  intl: ^0.20.2
  google_fonts: ^8.0.1
  provider: ^6.1.5+1
  http: ^1.2.0
  http_parser: ^4.1.1
  shared_preferences: ^2.2.2
  image_picker: ^1.0.4
  file_picker: ^8.0.0+1
  url_launcher: ^6.3.0
  geolocator: ^10.1.0
  permission_handler: ^11.0.1
  geocoding: ^2.1.1
  flutter_map: ^7.0.2
  latlong2: ^0.9.0
  firebase_core: ^3.11.0
  firebase_messaging: ^15.2.10
  flutter_local_notifications: ^18.0.1
  google_sign_in: ^6.2.1
  connectivity_plus: ^6.0.5
  timezone: ^0.9.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/logo/
