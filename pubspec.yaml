name: staff_track
description: "A Flutter app for tracking employee attendance."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  intl: ^0.20.2
  google_fonts: ^8.0.1
  provider: ^6.1.5+1
  http: ^1.2.0
  http_parser: ^4.1.1
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^10.2.0
  image_picker: ^1.0.4
  file_picker: ^12.0.0-beta.1
  url_launcher: ^6.3.0
  geolocator: ^14.0.1
  permission_handler: ^12.0.1
  geocoding: ^4.0.0
  flutter_map: ^8.3.0
  latlong2: ^0.9.0
  firebase_core: ^4.7.0
  firebase_messaging: ^16.2.0
  flutter_local_notifications: ^21.0.0
  google_sign_in: ^7.2.0
  connectivity_plus: ^7.1.1
  timezone: ^0.11.0
  share_plus: ^13.1.0
  path_provider: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/logo/
